name: release-please
on:
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Анализирует коммиты Conventional Commits в master и создаёт или
      # обновляет release-PR с changelog и версией; слияние PR тегаит релиз.
      # Manifest и конфиг action бустрапит сам в первом release-PR.
      # TODO: закрепить SHA после проверки в CI/на сервере (веб-поиск недоступен)
      - uses: googleapis/release-please-action@v4
