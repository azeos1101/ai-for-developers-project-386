# Шаг 6 (#33): запуск образа на VPS. Команды — из этого каталога: docker compose up -d.
services:
  app:
    # Имя образа: собирается локально или на VPS (docker build -t hexlet-ai-386:latest .
    # из корня репозитория) и переносится через docker save/load — см. README.md.
    image: hexlet-ai-386:latest
    # Альтернатива — сборка из копии репозитория прямо на VPS (контекст на каталог выше):
    #   build:
    #     context: ..
    container_name: hexlet-ai-386
    # Приложение слушает порт из переменной PORT (Dockerfile), контейнер — 0.0.0.0:8080.
    environment:
      PORT: "8080"
    # Порт публикуется только на loopback: наружу смотрит обратный прокси (Caddyfile),
    # контейнер снаружи напрямую недоступен.
    ports:
      - "127.0.0.1:8081:8080"
    # Контейнер переживает перезапуск VPS и падения процесса.
    restart: unless-stopped
    healthcheck:
      # $$PORT — экранирование compose: переменная вычисляется внутри контейнера.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8080}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
