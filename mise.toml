# Окружение проекта. Единая точка входа для человека, агента и хуков: `mise run check`.
[tools]
ruby = "3.3.11"
node = "25.9.0"
ast-grep = "0.51.3"
vacuum = "0.41.0"
hk = "2.13.0"
pkl = "0.33.0"

[tasks.install]
description = "Зависимости: гемы, компилятор контракта и фронтенд"
run = ["bundle install", "npm ci --prefix contract", "npm ci --prefix frontend", "mise run hooks:install"]

[tasks."hooks:install"]
description = "Установить git-хуки"
# --legacy: на Git >= 2.54 hk иначе регистрирует хуки через git-config, а не файлами .git/hooks/
run = "hk install --mise --legacy"

[tasks.generate]
description = "TypeSpec → openapi/openapi.yaml"
dir = "contract"
run = [
  "npx --no-install tsp compile .",
  "cp tsp-output/@typespec/openapi3/openapi.yaml ../openapi/openapi.yaml",
  "npm run generate:sdk --prefix ../frontend",
]

[tasks."generate:check"]
description = "Сгенерированное совпадает с контрактом (ручные правки openapi/ запрещены)"
depends = ["generate"]
run = '''
if [ -n "$(git status --porcelain -- openapi frontend/src/sdk)" ]; then
  git status --short -- openapi frontend/src/sdk
  echo "generate:check: openapi/ или frontend/src/sdk/ отличаются от contract/main.tsp; fix: правь contract/main.tsp, запусти mise run generate и закоммить результат"
  exit 1
fi
'''

[tasks.test]
description = "Тесты (minitest + rack-test)"
run = "bundle exec rake test"

[tasks."lint:ruby"]
description = "RuboCop"
run = "bundle exec rubocop"

[tasks."lint:ast"]
description = "Правила проекта (ast-grep) и их тесты"
run = ["ast-grep test --skip-snapshot-tests", "ast-grep scan"]

[tasks."lint:openapi"]
description = "Линт OpenAPI"
run = "vacuum lint --details openapi/openapi.yaml"

[tasks."lint:js"]
description = "oxlint (фронтенд)"
run = "npm run lint --prefix frontend"

[tasks.lint]
description = "Все линтеры"
depends = ["lint:ruby", "lint:ast", "lint:openapi", "lint:js"]

[tasks.check]
description = "Всё перед коммитом: линт, тесты, сгенерированное"
depends = ["lint", "test", "generate:check"]

[tasks.build]
description = "Сборка фронтенда в frontend/dist"
run = "npm run build --prefix frontend"

[tasks.dev]
description = "Vite dev-сервер, прокси /api на :4567"
run = "npm run dev --prefix frontend"

[tasks.run]
description = "Сервер на http://localhost:4567"
run = "bundle exec rackup -p 4567"
