# Окружение проекта. Единая точка входа для человека, агента и хуков: `mise run check`.
[tools]
ruby = "3.3.11"
node = "25.9.0"
ast-grep = "0.51.3"
vacuum = "0.41.0"
hk = "2.13.0"
pkl = "0.33.0"
gh = "2.105.0"
# Schemathesis (check:contract) — Python-CLI: pipx ставится как tool, сам пакет — через pipx-бэкенд с фиксацией версии
pipx = "1.14.0"
"pipx:schemathesis" = "4.33.4"

[tasks.install]
description = "Зависимости: гемы, компилятор контракта, фронтенд и e2e"
run = [
  "bundle install",
  "npm ci --prefix contract",
  "npm ci --prefix frontend",
  "npm ci --prefix e2e",
  "mise run e2e:browser",
  "mise run hooks:install",
]

[tasks."e2e:browser"]
description = "Chromium для Playwright: на CI (ubuntu) с системными зависимостями, локально — без sudo"
dir = "e2e"
run = '''
if [ "${CI:-}" = "true" ]; then
  npx --no-install playwright install --with-deps chromium
else
  npx --no-install playwright install chromium
fi
'''

[tasks."hooks:install"]
description = "Установить git-хуки"
# --legacy: на Git >= 2.54 hk иначе регистрирует хуки через git-config, а не файлами .git/hooks/
run = "hk install --mise --legacy"

[tasks.generate]
description = "TypeSpec → openapi/openapi.yaml"
dir = "contract"
run = [
  "npx --no-install tsp compile .",
  "cp tsp-output/@typespec/openapi3/openapi.yaml ../openapi/openapi.yaml",
  "npm run generate:sdk --prefix ../frontend",
]

[tasks."generate:check"]
description = "Сгенерированное совпадает с контрактом (ручные правки openapi/ запрещены)"
depends = ["generate"]
run = '''
if [ -n "$(git status --porcelain -- openapi frontend/src/sdk)" ]; then
  git status --short -- openapi frontend/src/sdk
  echo "generate:check: openapi/ или frontend/src/sdk/ отличаются от contract/main.tsp; fix: правь contract/main.tsp, запусти mise run generate и закоммить результат"
  exit 1
fi
'''

[tasks.test]
description = "Тесты (minitest + rack-test)"
depends = ["build"]
run = "bundle exec rake test"

[tasks."test:e2e"]
description = "Браузерные e2e-тесты (Playwright, chromium) — основной тест страниц, ADR-0002"
depends = ["build"]
dir = "e2e"
run = "npx --no-install playwright test"

[tasks."lint:ruby"]
description = "RuboCop"
run = "bundle exec rubocop"

[tasks."lint:ast"]
description = "Правила проекта (ast-grep) и их тесты"
run = ["ast-grep test --skip-snapshot-tests", "ast-grep scan"]

[tasks."lint:openapi"]
description = "Линт OpenAPI"
run = "vacuum lint --no-banner --errors --details openapi/openapi.yaml"

[tasks."lint:js"]
description = "oxlint (фронтенд)"
run = "npm run lint --prefix frontend"

[tasks."lint:types"]
description = "Проверка типов фронтенда (tsc по jsconfig.json, код остаётся JS)"
run = "npm run typecheck --prefix frontend"

[tasks."lint:e2e"]
description = "Типы e2e (tsc --noEmit по e2e/tsconfig.json)"
dir = "e2e"
run = "npx --no-install tsc --noEmit"

[tasks.lint]
description = "Все линтеры"
depends = ["lint:ruby", "lint:ast", "lint:openapi", "lint:js", "lint:types", "lint:e2e"]

[tasks.check]
description = "Всё перед коммитом: линт, тесты (включая e2e), сгенерированное"
depends = ["lint", "test", "test:e2e", "generate:check"]

# Отдельная проверка вне check (спецификация #19, тикет #30): фаззер меняет состояние
# сервера, поэтому сервер поднимается заново на своём порту и убивается в любом исходе (trap).
[tasks."check:contract"]
description = "Schemathesis: фаззинг запущенного сервера по openapi/openapi.yaml (в check не входит)"
run = '''
set -e
PORT="${PORT:-4590}"
LOG="$(mktemp)"
SERVER_PID=""
cleanup() {
  if [ -n "$SERVER_PID" ]; then
    kill "$SERVER_PID" 2>/dev/null || true
    wait "$SERVER_PID" 2>/dev/null || true
  fi
}
trap cleanup EXIT
bundle exec rackup -p "$PORT" >"$LOG" 2>&1 &
SERVER_PID=$!
READY=0
for _ in $(seq 1 60); do
  if ! kill -0 "$SERVER_PID" 2>/dev/null; then
    echo "check:contract: rackup на :$PORT завершился сразу; fix: смотри лог сервера ниже"
    cat "$LOG"
    exit 1
  fi
  if curl -fsS "http://localhost:$PORT/api/health" >/dev/null 2>&1; then
    READY=1
    break
  fi
  sleep 0.5
done
if [ "$READY" != 1 ]; then
  echo "check:contract: сервер на :$PORT не ответил на /api/health за 30s; fix: смотри лог сервера ниже"
  cat "$LOG"
  exit 1
fi
st run openapi/openapi.yaml --url "http://localhost:$PORT"
'''

[tasks.build]
description = "Сборка фронтенда в frontend/dist"
run = "npm run build --prefix frontend"

[tasks.dev]
description = "Vite dev-сервер, прокси /api на :4567"
run = "npm run dev --prefix frontend"

[tasks.run]
description = "Сервер на http://localhost:4567 (порт из переменной PORT, ADR-0001)"
run = 'bundle exec rackup -p "${PORT:-4567}"'

[tasks.setup]
description = "Демо-данные в уже запущенный сервис через его API (адрес из переменной PORT)"
run = 'bundle exec ruby script/setup.rb'
