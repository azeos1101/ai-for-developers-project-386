openapi: 3.0.0
info:
  title: Call Booking Service
  version: 1.0.0
  description: |-
    Упрощённый сервис бронирования времени по мотивам Cal.com.

    Правила предметной области (зафиксированы в контракте):
    - Окно записи: 14 календарных дней, начиная с сегодняшнего (по Europe/Moscow), окно сдвигается со временем.
    - Часы работы владельца: 09:00-18:00 Europe/Moscow (UTC+3).
    - Шаг доступных стартов: 30 минут (09:00, 09:30, ..., слот должен целиком помещаться в рабочие часы).
    - Длительность слота совпадает с длительностью выбранного типа встречи.
    - Слот нельзя занять в прошлом: старт должен быть не раньше текущего момента.
    - Пересечение интервалов запрещено, включая частичное наложение разных типов встреч.
      Встреча может начинаться в момент окончания предыдущей.
    - Правила действуют и для одновременных запросов: создаться может только одна бронь,
      остальные получают 409 Conflict.
tags: []
paths:
  /api/availability:
    get:
      operationId: Api_getAvailability
      parameters:
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          explode: false
        - name: meeting_type_id
          in: query
          required: true
          description: Идентификатор типа встречи
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/bookings:
    get:
      operationId: Api_listBookings
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      operationId: Api_createBooking
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
  /api/meeting-types:
    get:
      operationId: Api_listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: Api_createMeetingType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeInput'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    Availability:
      type: object
      required:
        - date
        - meeting_type_id
        - slots
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Дата в формате YYYY-MM-DD
        meeting_type_id:
          type: integer
          description: Идентификатор типа встречи
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Все старты дня с шагом 30 минут, помеченные доступностью
      description: Доступность слотов на конкретную дату для типа встречи
    Booking:
      type: object
      required:
        - id
        - meeting_type_id
        - meeting_type_name
        - duration
        - name
        - email
        - date
        - start
        - end
        - created_at
      properties:
        id:
          type: integer
        meeting_type_id:
          type: integer
          description: Тип встречи
        meeting_type_name:
          type: string
          description: Название типа встречи (денормализовано для удобства клиента)
        duration:
          type: integer
          description: Длительность слота в минутах
        name:
          type: string
          minLength: 1
          description: Имя гостя
        email:
          type: string
          minLength: 3
          description: Email гостя
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Дата слота, YYYY-MM-DD
        start:
          type: string
          pattern: ^\d{2}:\d{2}$
          description: Начало слота, HH:MM
        end:
          type: string
          pattern: ^\d{2}:\d{2}$
          description: Конец слота, HH:MM
        created_at:
          type: string
          description: Момент создания брони, ISO 8601
      description: Бронь звонка
    BookingInput:
      type: object
      required:
        - meeting_type_id
        - name
        - email
        - date
        - start
      properties:
        meeting_type_id:
          type: integer
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        start:
          type: string
          pattern: ^\d{2}:\d{2}$
      description: Запрос на создание брони
    ErrorCode:
      type: string
      enum:
        - validation
        - not_found
        - conflict
      description: Коды ошибок API
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - duration
      properties:
        id:
          type: integer
          description: Идентификатор типа встречи
        name:
          type: string
          minLength: 1
          description: Название (например, «Созвон-знакомство»)
        description:
          type: string
          description: Описание встречи
        duration:
          type: integer
          minimum: 1
          description: Длительность встречи в минутах
      description: Тип встречи, заведённый владельцем календаря
    MeetingTypeInput:
      type: object
      required:
        - name
        - duration
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ''
        duration:
          type: integer
          minimum: 1
      description: Запрос на создание типа встречи
    Slot:
      type: object
      required:
        - start
        - end
        - available
      properties:
        start:
          type: string
          pattern: ^\d{2}:\d{2}$
          description: Время начала слота, HH:MM (Europe/Moscow)
        end:
          type: string
          pattern: ^\d{2}:\d{2}$
          description: Время окончания слота, HH:MM (Europe/Moscow)
        available:
          type: boolean
          description: true, если слот свободен и его можно забронировать
      description: Один слот дня в разрезе доступности
