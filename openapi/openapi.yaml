openapi: 3.0.0
info:
  title: Call Booking Service
  version: 1.0.0
  description: |-
    Упрощённый сервис бронирования времени по мотивам Cal.com.

    Правила предметной области (зафиксированы в контракте):
    - Окно записи: 14 календарных дней, начиная с сегодняшнего (по Europe/Moscow), окно сдвигается со временем.
    - Часы работы владельца: 09:00-18:00 Europe/Moscow (UTC+3).
    - Шаг доступных стартов: 30 минут (09:00, 09:30, ..., слот должен целиком помещаться в рабочие часы).
    - Длительность слота совпадает с длительностью выбранного типа встречи.
    - Слот нельзя занять в прошлом: старт должен быть не раньше текущего момента.
    - Пересечение интервалов запрещено, включая частичное наложение разных типов встреч.
      Встреча может начинаться в момент окончания предыдущей.
    - Правила действуют и для одновременных запросов: создаться может только одна бронь,
      остальные получают 409 Conflict.
tags: []
paths:
  /api/availability:
    get:
      operationId: Api_getAvailability
      description: |-
        Доступность стартов конкретной даты: только старты с шагом 30 минут, целиком
        влезающие в рабочие часы 09:00-18:00. Прошедшие старты сегодняшнего дня —
        `available: false`. Неизвестный `meeting_type_id` — 404 not_found; дата в
        прошлом, вне окна или неверного формата — 422 validation.
      parameters:
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          explode: false
        - name: meeting_type_id
          in: query
          required: true
          description: Идентификатор типа встречи (слаг)
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}$
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '404':
          description: Тип встречи с таким идентификатором не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Отказ по формату поля или доменным правилам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/availability/days:
    get:
      operationId: Api_getAvailabilityDays
      description: |-
        Счётчики свободных слотов по всем дням окна записи за один запрос.
        Ответ содержит все 14 дней окна по возрастанию даты, включая дни с нулём
        свободных слотов. Неизвестный `meeting_type_id` — 404 not_found;
        неверный формат параметра — 422 validation.
      parameters:
        - name: meeting_type_id
          in: query
          required: true
          description: Идентификатор типа встречи (слаг)
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}$
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySummary'
        '404':
          description: Тип встречи с таким идентификатором не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Отказ по формату поля или доменным правилам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/bookings:
    get:
      operationId: Api_listBookings
      description: |-
        Предстоящие брони: только со стартом строго позже текущего момента
        (Europe/Moscow), отсортированы по дате и началу по возрастанию;
        пустой массив, когда записей нет.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      operationId: Api_createBooking
      description: |-
        Запись на слот. Формат полей и доменные правила (дата вне окна, старт в прошлом,
        старт не на сетке 30 минут или не влезающий в часы, неизвестный
        `meeting_type_id`) — 422 validation. Пересечение интервалов, включая частичное
        наложение разных типов встреч и одновременные запросы, — 409 conflict;
        при гонке создаётся ровно одна бронь.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: Время уже занято (фактический конфликт интервалов или гонка)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: Отказ по формату поля или доменным правилам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
  /api/health:
    get:
      operationId: Api_health
      description: Проверка живости сервиса
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/meeting-types:
    get:
      operationId: Api_listMeetingTypes
      description: Список типов встреч
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: Api_createMeetingType
      description: |-
        Создание типа встречи. `id` задаёт владелец — слаг `^[a-z0-9-]{1,64}$`.
        Неверный формат `id`, названия или длительности (вне 30-240 или не кратна 30) —
        422 validation; занятый `id` — 409 conflict.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '409':
          description: Время уже занято (фактический конфликт интервалов или гонка)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: Отказ по формату поля или доменным правилам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeInput'
components:
  schemas:
    Availability:
      type: object
      required:
        - date
        - meeting_type_id
        - slots
      properties:
        date:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: Дата в формате YYYY-MM-DD
        meeting_type_id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Идентификатор типа встречи (слаг)
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Все влезающие в рабочие часы старты дня с шагом 30 минут, помеченные доступностью
      description: |-
        Доступность слотов на конкретную дату для типа встречи.

          День содержит только старты с шагом 30 минут, чей слот целиком помещается
          в рабочие часы; старты, не влезающие в часы, не возвращаются. Прошедшие старты
          сегодняшнего дня возвращаются с `available: false`.
    AvailabilitySummary:
      type: object
      required:
        - meeting_type_id
        - days
      properties:
        meeting_type_id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Идентификатор типа встречи (слаг)
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayAvailability'
          description: Все 14 дней окна по возрастанию даты
      description: |-
        Доступность по дням всего 14-дневного окна для типа встречи.

          Содержит все дни окна по возрастанию даты, включая дни с нулём свободных слотов.
    Booking:
      type: object
      required:
        - id
        - meeting_type_id
        - meeting_type_name
        - duration
        - name
        - email
        - date
        - start
        - end
        - created_at
      properties:
        id:
          type: integer
          description: Идентификатор брони
        meeting_type_id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Тип встречи (слаг)
        meeting_type_name:
          type: string
          description: Название типа встречи (денормализовано для удобства клиента)
        duration:
          type: integer
          minimum: 30
          maximum: 240
          multipleOf: 30
          description: Длительность слота в минутах
        name:
          type: string
          minLength: 1
          description: Имя гостя
        email:
          type: string
          minLength: 3
          description: Email гостя
        date:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: Дата слота, YYYY-MM-DD
        start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Начало слота, HH:MM
        end:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Конец слота, HH:MM
        created_at:
          type: string
          description: Момент создания брони, ISO 8601
      description: Бронь звонка
    BookingInput:
      type: object
      required:
        - meeting_type_id
        - name
        - email
        - date
        - start
      properties:
        meeting_type_id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Тип встречи (слаг)
        name:
          type: string
          minLength: 1
          description: Имя гостя
        email:
          type: string
          minLength: 3
          description: Email гостя
        date:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: Дата слота, YYYY-MM-DD
        start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Начало слота, HH:MM (Europe/Moscow), шаг 30 минут
      description: Запрос на создание брони
    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - conflict
          description: Причина отказа
        message:
          type: string
          description: Человекочитаемое объяснение отказа
      description: Время уже занято (фактический конфликт интервалов или гонка)
    DayAvailability:
      type: object
      required:
        - date
        - available_count
      properties:
        date:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: Дата в формате YYYY-MM-DD
        available_count:
          type: integer
          minimum: 0
          description: Число стартов, доступных для брони (целиком в рабочих часах, не прошедшие, без пересечений)
      description: Число свободных слотов одного дня окна записи
    ErrorCode:
      type: string
      enum:
        - validation
        - not_found
        - conflict
      description: Машинночитаемый код ошибки API
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Состояние сервиса
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - duration
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Идентификатор типа встречи — слаг, который задаёт владелец
        name:
          type: string
          minLength: 1
          description: Название (например, «Созвон-знакомство»)
        description:
          type: string
          description: Описание встречи
        duration:
          type: integer
          minimum: 30
          maximum: 240
          multipleOf: 30
          description: Длительность встречи в минутах — от 30 до 240 включительно, кратна 30
      description: Тип встречи, заведённый владельцем календаря
    MeetingTypeInput:
      type: object
      required:
        - id
        - name
        - duration
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: Идентификатор типа встречи — слаг `^[a-z0-9-]{1,64}$` (например, `intro-call`)
        name:
          type: string
          minLength: 1
          description: Название встречи
        description:
          type: string
          description: Описание встречи
          default: ''
        duration:
          type: integer
          minimum: 30
          maximum: 240
          multipleOf: 30
          description: Длительность встречи в минутах — от 30 до 240 включительно, кратна 30
      description: Запрос на создание типа встречи; id задаёт владелец
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - not_found
          description: Причина отказа
        message:
          type: string
          description: Человекочитаемое объяснение отказа
      description: Тип встречи с таким идентификатором не существует
    Slot:
      type: object
      required:
        - start
        - end
        - available
      properties:
        start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время начала слота, HH:MM (Europe/Moscow)
        end:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Время окончания слота, HH:MM (Europe/Moscow)
        available:
          type: boolean
          description: true, если слот свободен и его можно забронировать
      description: Один слот дня в разрезе доступности
    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation
          description: Причина отказа
        message:
          type: string
          description: Человекочитаемое объяснение отказа
      description: Отказ по формату поля или доменным правилам
